<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>店舗用ダッシュボード</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="header-container">
        <div class="filter-group">
            <span style="font-size: 16px;">🏢 店舗選択:</span>
            <select id="store-selector" onchange="renderAll()"></select>
        </div>
        <div class="filter-group" style="margin-left: 20px;">
            <span>📅 表示月: </span>
            <select id="month-selector" onchange="changeMonth()"></select>
        </div>
    </div>
    
    <div id="loading">データを読込中...</div>
    
    <div class="main-content">
        <div class="left-pane" id="left-table-container"></div>
        <div class="right-pane" id="right-table-container"></div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
