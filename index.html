<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>店舗別ダッシュボード</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="tab-menu-container">
        <div class="tab-btn-group">
            <button class="tab-btn active" id="btn-staff" onclick="showPage('staff-page')">👤 月</button>
            <button class="tab-btn" id="btn-daily" onclick="showPage('daily-page')">📅 日</button>
        </div>
        <div class="filter-group">
            <span>📅 月: </span><select id="month-selector" onchange="syncMonthToCalendar()"></select>
            <input type="date" id="start-date" class="date-input" onchange="fetchByCOQL()"> ～
            <input type="date" id="end-date" class="date-input" onchange="fetchByCOQL()">
            
            <div style="margin-left:10px;">🏢 <select id="store-selector" onchange="renderAll()"></select></div>
        </div>
    </div>
    <div id="loading">実績を集計しています...</div>

    <div id="staff-page" class="page-content active">
        <div class="table-wrapper" id="staff-table-container"></div>
    </div>
    <div id="daily-page" class="page-content">
        <div class="table-wrapper" id="daily-table-container"></div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
